<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">ActiveDex environment-aware active vision architecture</title>
  <desc id="desc">Environment memory and task-aware view value drive coupled base, arm, and dexterous hand actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09242c"/>
      <stop offset="1" stop-color="#123e45"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#8ee6df" opacity=".13"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8ee6df"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#001015" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
