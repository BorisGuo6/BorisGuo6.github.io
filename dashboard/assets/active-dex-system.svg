  <text x="504" y="587" font-family="Avenir Next, sans-serif" font-size="18" fill="#45cbd0">→</text>
  <text x="538" y="587" font-family="Avenir Next, sans-serif" font-size="18" font-weight="700" fill="#f4f3e8">OPEN</text>
  <text x="628" y="587" font-family="Avenir Next, sans-serif" font-size="18" fill="#45cbd0">→</text>
  <text x="662" y="587" font-family="Avenir Next, sans-serif" font-size="18" font-weight="700" fill="#f4f3e8">INSPECT</text>
  <text x="780" y="587" font-family="Avenir Next, sans-serif" font-size="18" fill="#45cbd0">→</text>
  <text x="814" y="587" font-family="Avenir Next, sans-serif" font-size="18" font-weight="700" fill="#f4f3e8">RETRIEVE</text>
  <text x="956" y="587" font-family="Avenir Next, sans-serif" font-size="18" fill="#45cbd0">→</text>
  <text x="990" y="587" font-family="Avenir Next, sans-serif" font-size="18" font-weight="700" fill="#f4f3e8">DELIVER</text>

  <text x="64" y="650" font-family="Avenir Next, sans-serif" font-size="14" font-weight="700" fill="#a7c6c5">XLEROBOT + AMAZINGHAND</text>
  <text x="1136" y="650" text-anchor="end" font-family="Avenir Next, sans-serif" font-size="14" fill="#a7c6c5">LV ROBOTICS LAB · 2026</text>
