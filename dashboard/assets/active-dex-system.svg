  <text x="210" y="587" font-family="Avenir Next, sans-serif" font-size="18" fill="#45cbd0">→</text>
  <text x="244" y="587" font-family="Avenir Next, sans-serif" font-size="18" font-weight="700" fill="#f4f3e8">ALIGN</text>
  <text x="344" y="587" font-family="Avenir Next, sans-serif" font-size="18" fill="#45cbd0">→</text>
