  <path d="M636 326H688" fill="none" stroke="#8ee6df" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="64" y="520" width="1072" height="94" rx="22" fill="#0a2027" stroke="#8ee6df" stroke-opacity=".22"/>
