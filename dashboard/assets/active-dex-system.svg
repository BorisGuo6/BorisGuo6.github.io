    <text x="912" y="365" text-anchor="middle" font-family="Avenir Next, sans-serif" font-size="14" fill="#49666a">trajectory</text>
    <text x="1044" y="341" text-anchor="middle" font-family="Avenir Next, sans-serif" font-size="15" font-weight="800" fill="#09242c">HAND</text>
    <text x="1044" y="365" text-anchor="middle" font-family="Avenir Next, sans-serif" font-size="14" fill="#153f45">AmazingHand</text>
    <text x="730" y="421" font-family="Avenir Next, sans-serif" font-size="14" fill="#a7c6c5">mutually conditioned · contact-aware · receding horizon</text>
