<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">DexTTT deployment learning system</title>
  <desc id="desc">A factorized arm-hand actor, geometry-conditioned value model, human correction, and guarded policy update form a closed loop.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b241f" stroke-opacity=".08"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#213027"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#17211b" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="680" rx="28" fill="#f2eee4"/>
  <rect width="1200" height="680" rx="28" fill="url(#grid)"/>
  <rect x="54" y="48" width="8" height="82" rx="4" fill="#ee5b3e"/>
  <text x="84" y="83" font-family="Avenir Next, Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#ee5b3e" letter-spacing="3">DEPLOYMENT LEARNING</text>
  <text x="82" y="126" font-family="Avenir Next, Noto Sans SC, sans-serif" font-size="52" font-weight="800" fill="#17211b">DexTTT</text>
  <text x="305" y="123" font-family="Avenir Next, Noto Sans SC, sans-serif" font-size="22" fill="#526158">54D arm-hand policies that improve on the real robot</text>

  <g filter="url(#shadow)">
    <rect x="76" y="204" width="290" height="186" rx="22" fill="#17211b"/>
    <text x="104" y="242" font-family="Avenir Next, sans-serif" font-size="15" font-weight="700" fill="#f4b447" letter-spacing="2">FACTOR A</text>
    <text x="104" y="278" font-family="Avenir Next, sans-serif" font-size="27" font-weight="700" fill="#fffaf0">Factorized Actor</text>
    <rect x="104" y="304" width="104" height="48" rx="12" fill="#ee5b3e"/>
    <rect x="222" y="304" width="116" height="48" rx="12" fill="#8ab45c"/>
    <text x="121" y="335" font-family="Avenir Next, sans-serif" font-size="16" font-weight="700" fill="#fff">ARM 14D</text>
    <text x="238" y="335" font-family="Avenir Next, sans-serif" font-size="16" font-weight="700" fill="#17211b">HAND 40D</text>
    <text x="104" y="374" font-family="Avenir Next, sans-serif" font-size="14" fill="#cdd5cf">Shared RGB + proprio + task context</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="455" y="204" width="290" height="186" rx="22" fill="#fffaf0"/>
    <text x="483" y="242" font-family="Avenir Next, sans-serif" font-size="15" font-weight="700" fill="#ee5b3e" letter-spacing="2">FACTOR B</text>
    <text x="483" y="278" font-family="Avenir Next, sans-serif" font-size="27" font-weight="700" fill="#17211b">Value / Q Model</text>
    <text x="483" y="314" font-family="Avenir Next, sans-serif" font-size="16" fill="#526158">RGB + proprio + goal geometry</text>
    <text x="483" y="343" font-family="Avenir Next, sans-serif" font-size="16" fill="#526158">V, Q, A<tspan baseline-shift="sub" font-size="11">arm</tspan>, A<tspan baseline-shift="sub" font-size="11">hand</tspan>, uncertainty</text>
    <rect x="483" y="361" width="224" height="8" rx="4" fill="#f4b447"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="834" y="204" width="290" height="186" rx="22" fill="#ee5b3e"/>
    <text x="862" y="242" font-family="Avenir Next, sans-serif" font-size="15" font-weight="700" fill="#17211b" letter-spacing="2">FACTOR C</text>
    <text x="862" y="278" font-family="Avenir Next, sans-serif" font-size="27" font-weight="700" fill="#fffaf0">Human Takeover</text>
    <text x="862" y="314" font-family="Avenir Next, sans-serif" font-size="16" fill="#fff4e8">Quick attach + intervention masks</text>
    <text x="862" y="343" font-family="Avenir Next, sans-serif" font-size="16" fill="#fff4e8">Targeted DAgger supervision</text>
    <circle cx="879" cy="369" r="7" fill="#f4b447"/>
    <circle cx="902" cy="369" r="7" fill="#8ab45c"/>
    <circle cx="925" cy="369" r="7" fill="#fffaf0"/>
  </g>

  <path d="M366 297H443" fill="none" stroke="#213027" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M745 297H822" fill="none" stroke="#213027" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="170" y="470" width="860" height="128" rx="24" fill="#dce5d3"/>
    <text x="204" y="508" font-family="Avenir Next, sans-serif" font-size="15" font-weight="700" fill="#536c3d" letter-spacing="2">GUARDED UPDATE LOOP</text>
    <text x="204" y="546" font-family="Avenir Next, sans-serif" font-size="22" font-weight="700" fill="#17211b">rollout</text>
    <text x="334" y="546" font-family="Avenir Next, sans-serif" font-size="22" fill="#657368">→</text>
    <text x="378" y="546" font-family="Avenir Next, sans-serif" font-size="22" font-weight="700" fill="#17211b">credit</text>
    <text x="489" y="546" font-family="Avenir Next, sans-serif" font-size="22" fill="#657368">→</text>
    <text x="533" y="546" font-family="Avenir Next, sans-serif" font-size="22" font-weight="700" fill="#17211b">update</text>
    <text x="656" y="546" font-family="Avenir Next, sans-serif" font-size="22" fill="#657368">→</text>
    <text x="700" y="546" font-family="Avenir Next, sans-serif" font-size="22" font-weight="700" fill="#17211b">safety gate</text>
    <text x="858" y="546" font-family="Avenir Next, sans-serif" font-size="22" fill="#657368">→</text>
    <text x="902" y="546" font-family="Avenir Next, sans-serif" font-size="22" font-weight="700" fill="#17211b">deploy</text>
    <text x="204" y="577" font-family="Avenir Next, sans-serif" font-size="14" fill="#526158">Four tasks · global return · local interventions · calibrated rollback</text>
  </g>

  <path d="M979 390V438Q979 452 963 452H237Q221 452 221 438V402" fill="none" stroke="#213027" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="82" y="642" font-family="Avenir Next, sans-serif" font-size="14" font-weight="700" fill="#526158">DUAL FRANKA + DUAL WUJI</text>
  <text x="1119" y="642" text-anchor="end" font-family="Avenir Next, sans-serif" font-size="14" fill="#526158">LV ROBOTICS LAB · 2026</text>
</svg>
