<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">EgoSensorium multimodal wearable system</title>
  <desc id="desc">A human-centered wearable rig connecting head stereo vision, wrist cameras, hand pressure, muscle sensing, spatial audio, six body trackers and chest haptic feedback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F3EA"/>
      <stop offset="1" stop-color="#E8F2F0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#17324D" flood-opacity="0.13"/>
    </filter>
    <style>
      .sans{font-family:Manrope,Helvetica,Arial,sans-serif}.title{font-size:72px;font-weight:800;fill:#17324D}.sub{font-size:26px;font-weight:600;fill:#567083}.label{font-size:22px;font-weight:750;fill:#17324D}.small{font-size:17px;font-weight:600;fill:#567083}.tiny{font-size:14px;font-weight:700;fill:#567083;letter-spacing:1.5px}.card{fill:#FFFFFF;stroke:#D5E0E5;stroke-width:2}.line{stroke:#147D74;stroke-width:4;fill:none;stroke-linecap:round}.dash{stroke:#D97732;stroke-width:4;fill:none;stroke-linecap:round;stroke-dasharray:10 12}.node{fill:#147D74;stroke:#FFFFFF;stroke-width:5}.orange{fill:#D97732}.navy{fill:#17324D}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1480" cy="80" r="170" fill="#DCECE8" opacity="0.7"/>
  <circle cx="80" cy="830" r="210" fill="#F4DDC8" opacity="0.65"/>
  <text x="90" y="104" class="sans tiny">LV ROBOTICS LAB  /  HUMAN-CENTERED DATA</text>
  <text x="90" y="182" class="sans title">EgoSensorium</text>
  <text x="94" y="228" class="sans sub">A synchronized, bidirectional wearable system for robot learning</text>

  <g filter="url(#shadow)">
    <rect x="80" y="286" width="360" height="500" rx="34" class="card"/>
    <rect x="1160" y="286" width="360" height="500" rx="34" class="card"/>
    <rect x="478" y="286" width="644" height="500" rx="42" fill="#17324D"/>
  </g>

  <text x="120" y="338" class="sans tiny">SENSE</text>
  <g class="sans">
    <circle cx="132" cy="390" r="13" class="node"/><text x="164" y="398" class="label">Head stereo</text><text x="164" y="423" class="small">Scene geometry + egocentric view</text>
    <circle cx="132" cy="478" r="13" class="node"/><text x="164" y="486" class="label">Two wrist cameras</text><text x="164" y="511" class="small">Near-field hand-object evidence</text>
    <circle cx="132" cy="566" r="13" class="node"/><text x="164" y="574" class="label">Gaze + face</text><text x="164" y="599" class="small">Attention and human state</text>
    <circle cx="132" cy="654" r="13" class="node"/><text x="164" y="662" class="label">Touch + muscle</text><text x="164" y="687" class="small">Contact and action preparation</text>
    <circle cx="132" cy="742" r="13" class="node"/><text x="164" y="750" class="label">Spatial audio</text><text x="164" y="775" class="small">Sound direction and physical events</text>
  </g>

  <text x="1200" y="338" class="sans tiny">CLOSE THE LOOP</text>
  <g class="sans">
    <rect x="1200" y="374" width="278" height="92" rx="20" fill="#E9F5F3"/><text x="1224" y="410" class="label">Data quality</text><text x="1224" y="439" class="small">Visibility, tracking, sync</text>
    <rect x="1200" y="490" width="278" height="92" rx="20" fill="#EEF3F8"/><text x="1224" y="526" class="label">Robotability</text><text x="1224" y="555" class="small">Reach, limits, retargeting</text>
    <rect x="1200" y="606" width="278" height="92" rx="20" fill="#FAEBDD"/><text x="1224" y="642" class="label">Uncertainty</text><text x="1224" y="671" class="small">Novel or ambiguous segments</text>
    <circle cx="1220" cy="746" r="17" class="orange"/><circle cx="1264" cy="746" r="17" class="orange" opacity="0.55"/><circle cx="1308" cy="746" r="17" class="orange" opacity="0.25"/>
    <text x="1344" y="754" class="label">Chest haptic</text>
  </g>

  <g transform="translate(800 492)">
    <circle cx="0" cy="-122" r="58" fill="#F6C9A9"/>
    <path d="M-73 -72 Q0 -112 73 -72 L98 120 Q0 162 -98 120Z" fill="#EAF2F5" stroke="#84A3B5" stroke-width="4"/>
    <path d="M-75 -58 L-218 72" stroke="#F6C9A9" stroke-width="42" stroke-linecap="round"/>
    <path d="M75 -58 L218 72" stroke="#F6C9A9" stroke-width="42" stroke-linecap="round"/>
    <path d="M-218 72 L-292 174" stroke="#F6C9A9" stroke-width="34" stroke-linecap="round"/>
    <path d="M218 72 L292 174" stroke="#F6C9A9" stroke-width="34" stroke-linecap="round"/>
    <path d="M-84 118 L-118 270" stroke="#425F72" stroke-width="48" stroke-linecap="round"/>
    <path d="M84 118 L118 270" stroke="#425F72" stroke-width="48" stroke-linecap="round"/>
    <path d="M-70 -158 Q0 -220 70 -158 L76 -98 Q0 -72 -76 -98Z" fill="#243E53"/>
    <rect x="-70" y="-186" width="140" height="38" rx="18" fill="#147D74"/>
    <circle cx="0" cy="-188" r="13" class="orange"/>
    <circle cx="0" cy="16" r="17" class="orange"/>
    <circle cx="-102" cy="-46" r="14" class="node"/><circle cx="102" cy="-46" r="14" class="node"/>
    <circle cx="-290" cy="174" r="15" class="node"/><circle cx="290" cy="174" r="15" class="node"/>
    <rect x="-348" y="142" width="78" height="52" rx="13" fill="#17324D"/><rect x="270" y="142" width="78" height="52" rx="13" fill="#17324D"/>
    <circle cx="-310" cy="201" r="14" class="orange"/><circle cx="310" cy="201" r="14" class="orange"/>
    <path d="M-230 93 Q-235 180 -310 201" class="dash"/><path d="M230 93 Q235 180 310 201" class="dash"/>
    <path d="M-102 -46 Q-180 -20 -230 93" class="line"/><path d="M102 -46 Q180 -20 230 93" class="line"/>
  </g>

  <text x="800" y="732" text-anchor="middle" class="sans label" fill="#FFFFFF">6 tracked rigid bodies</text>
  <text x="800" y="765" text-anchor="middle" class="sans small" fill="#C9D8E2">Head  /  Chest  /  Upper arms  /  Hands</text>
  <path d="M440 532 C470 532 470 532 500 532" class="line"/>
  <path d="M1100 532 C1130 532 1130 532 1160 532" class="dash"/>
  <text x="800" y="845" text-anchor="middle" class="sans tiny">ONE HUMAN  /  ONE EPISODE  /  ONE CLOCK  /  ONE COORDINATE TREE</text>
</svg>