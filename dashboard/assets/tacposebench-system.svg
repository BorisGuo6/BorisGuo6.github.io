<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TacPoseBench future in-gripper pose planning system</title>
  <desc id="desc">Vision, touch, language and proprioception enter PosePlan-VTLA, which jointly predicts future SE2 in-gripper pose tokens and robot action chunks, then closes the loop through contacts with tables, edges, walls, objects or another gripper.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8F4EA"/><stop offset="1" stop-color="#E8F3F1"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#183043" flood-opacity="0.13"/></filter>
    <style>.sans{font-family:Manrope,Helvetica,Arial,sans-serif}.title{font-size:70px;font-weight:800;fill:#183043}.sub{font-size:25px;font-weight:600;fill:#607487}.tiny{font-size:14px;font-weight:750;letter-spacing:1.7px;fill:#607487}.label{font-size:22px;font-weight:780;fill:#183043}.small{font-size:17px;font-weight:600;fill:#607487}.card{fill:#fff;stroke:#D4E0E6;stroke-width:2}.teal{fill:#0F7E74}.orange{fill:#D97732}.line{stroke:#0F7E74;stroke-width:5;fill:none;stroke-linecap:round}.dash{stroke:#D97732;stroke-width:4;fill:none;stroke-linecap:round;stroke-dasharray:10 12}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><circle cx="1480" cy="70" r="180" fill="#DCECE8"/><circle cx="60" cy="840" r="200" fill="#F4DDC8"/>
  <text x="80" y="92" class="sans tiny">LV ROBOTICS LAB  /  COBOT GROUP</text><text x="80" y="172" class="sans title">TacPoseBench</text><text x="84" y="216" class="sans sub">Future in-gripper pose planning for extrinsic dexterity</text>
  <g filter="url(#shadow)"><rect x="72" y="278" width="334" height="500" rx="30" class="card"/><rect x="446" y="278" width="704" height="500" rx="38" fill="#183043"/><rect x="1190" y="278" width="338" height="500" rx="30" class="card"/></g>
  <text x="108" y="326" class="sans tiny">MULTIMODAL OBSERVATION</text>
  <g class="sans"><rect x="108" y="356" width="262" height="72" rx="16" fill="#EAF5F3"/><text x="132" y="388" class="label">Vision</text><text x="132" y="414" class="small">contact affordances</text><rect x="108" y="448" width="262" height="72" rx="16" fill="#EAF5F3"/><text x="132" y="480" class="label">Touch</text><text x="132" y="506" class="small">contact + slip history</text><rect x="108" y="540" width="262" height="72" rx="16" fill="#EDF4FA"/><text x="132" y="572" class="label">Language</text><text x="132" y="598" class="small">task + target pose</text><rect x="108" y="632" width="262" height="72" rx="16" fill="#FBEEE2"/><text x="132" y="664" class="label">Proprioception</text><text x="132" y="690" class="small">arm + gripper state</text></g>
  <path d="M406 525 H446" class="line"/><text x="798" y="330" text-anchor="middle" class="sans tiny" fill="#BFD0DB">POSEPLAN-VTLA</text>
  <rect x="500" y="366" width="596" height="152" rx="24" fill="#EAF5F3"/><text x="538" y="407" class="sans label" fill="#0F7E74">FUTURE SE(2) POSE PLAN</text><text x="538" y="441" class="sans small">X̂t+1:t+H = [(x, y, θ), ...]</text>
  <g transform="translate(690 477)"><rect x="-25" y="-11" width="50" height="22" rx="5" class="orange"/><line x1="0" y1="-28" x2="0" y2="28" stroke="#183043" stroke-width="3"/></g><g transform="translate(770 477) rotate(8)"><rect x="-25" y="-11" width="50" height="22" rx="5" class="orange"/><line x1="0" y1="-28" x2="0" y2="28" stroke="#183043" stroke-width="3"/></g><g transform="translate(850 477) rotate(18)"><rect x="-25" y="-11" width="50" height="22" rx="5" class="orange"/><line x1="0" y1="-28" x2="0" y2="28" stroke="#183043" stroke-width="3"/></g>
  <path d="M798 518 V558" class="dash"/><rect x="500" y="558" width="596" height="146" rx="24" fill="#FBEEE2"/><text x="538" y="601" class="sans label" fill="#D97732">FLOW-MATCHING ACTION CHUNK</text><text x="538" y="638" class="sans small">dual-arm delta pose + gripper commands</text><text x="538" y="674" class="sans small">execute K steps, sense again, replan</text>
  <path d="M1150 525 H1190" class="line"/><text x="1226" y="326" class="sans tiny">EXTRINSIC CONTACT LOOP</text>
  <g class="sans"><rect x="1226" y="356" width="264" height="62" rx="16" fill="#EAF5F3"/><text x="1250" y="395" class="label">Table / Edge</text><rect x="1226" y="438" width="264" height="62" rx="16" fill="#EDF4FA"/><text x="1250" y="477" class="label">Wall / Fixture</text><rect x="1226" y="520" width="264" height="62" rx="16" fill="#FBEEE2"/><text x="1250" y="559" class="label">Other Object</text><rect x="1226" y="602" width="264" height="62" rx="16" fill="#F0EEF6"/><text x="1250" y="641" class="label">Other Gripper</text><text x="1226" y="710" class="small">touch → update → replan</text></g>
  <path d="M1358 778 C1200 842 980 836 930 778" class="dash"/>
  <g class="sans"><text x="80" y="848" class="tiny">BENCHMARK TRACKS</text><text x="310" y="848" class="label">Pose Forecast</text><text x="600" y="848" class="label">Pose Regulation</text><text x="925" y="848" class="label">Contact Generalization</text><text x="1315" y="848" class="label">Downstream Utility</text></g>
</svg>